# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp "Last updated" from the latest commit (Arizona time)
        env:
          TZ: America/Phoenix
        run: |
          iso=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          nice=$(git log -1 --format=%cd --date=format-local:'%B %-d, %Y')
          for f in site/index.html site/privacy.html site/terms.html site/support.html; do
            sed -i -E "s#<time datetime=\"[^\"]*\" data-last-updated>[^<]*</time>#<time datetime=\"$iso\" data-last-updated>$nice</time>#" "$f"
            grep -q "data-last-updated>$nice</time>" "$f" || { echo "::error file=$f::Last updated date was not set"; exit 1; }
          done
          echo "Last updated: $nice"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
